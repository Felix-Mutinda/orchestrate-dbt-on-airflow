name: CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.0"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync
      
      - name: Create runtime directories
        run: mkdir -p var/data var/duckdb var/feast

      - name: Fetch dataset
        run: uv run python scripts/fetch_dataset.py

      - name: Run dbt build
        run: uv run dbt build --project-dir dbt_project --profiles-dir dbt_project

      - name: Run all tests (P1-P5)
        run: uv run pytest tests/ -v

      - name: Generate dbt docs
        run: uv run python scripts/generate_dbt_docs.py

      - name: Run Promotion Proof
        run: uv run python scripts/validate_promotion.py